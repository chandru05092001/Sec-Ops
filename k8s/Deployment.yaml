apiVersion: apps/v1
kind: Deployment

metadata:
  name: secops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: secops-app

  template:
    metadata:
      labels:
        app: secops-app

    spec:
      containers:
      - name: secops-app
        image: chandru0509/nginx:v1
        ports:
        - containerPort: 80
